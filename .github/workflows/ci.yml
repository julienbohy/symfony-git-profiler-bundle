name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  quality:
    uses: ./.github/workflows/quality.yml
    # CODECOV_TOKEN for the coverage upload (reusable workflows do not see the caller's secrets otherwise).
    secrets: inherit
